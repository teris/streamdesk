<section class="panel" data-expert-only data-service="automation"><h2>Hooks</h2><form id="automation-hook-form"><label>Ereignis<select id="automation-event"><option value="publish">Quelle veröffentlicht</option><option value="ready">Programm bereit</option></select></label><label>Allowlist-Aktion<select id="automation-action"></select></label><button class="secondary">Hook hinzufügen</button></form><div id="automation-hooks"></div><p class="small muted">Befehle werden ausschließlich über <code>STREAMDESK_HOOK_ALLOWLIST</code> bereitgestellt, nach 15 Sekunden beendet und erhalten keine Streamschlüssel oder sonstigen Secrets.</p></section>
<section class="panel" data-expert-only data-service="automation"><h2>Zeitplan</h2><form id="automation-job-form"><label>Aktion<select id="automation-kind"><option value="record_start">Aufnahme starten</option><option value="record_stop">Aufnahme stoppen</option><option value="output_start">Ausgang starten</option><option value="output_stop">Ausgang stoppen</option></select></label><label>Quelle oder Ausgangskennung<input id="automation-target" placeholder="live oder twitch"></label><label>Zeitpunkt<input id="automation-time" type="datetime-local" required></label><button class="secondary">Einplanen</button></form><div id="automation-jobs"></div></section>
<section class="panel" data-expert-only data-service="automation"><h2>Cloud-/WebDAV-Export</h2><form id="automation-export-form"><label class="feature-check"><input id="automation-export-enabled" type="checkbox"> Fertige manuelle Aufnahmen exportieren</label><label>Öffentliche HTTPS-Zieladresse mit abschließendem /<input id="automation-export-url" type="url"></label><label>Benutzername<input id="automation-export-user"></label><label>Neues Passwort<input id="automation-export-password" type="password" autocomplete="new-password"></label><button class="secondary">Export speichern</button></form></section>
<section class="panel" data-expert-only data-service="notifications"><h2>Fehlerbenachrichtigungen</h2><form id="notification-form"><label class="feature-check"><input id="notification-enabled" type="checkbox"> Offline-, Speicher- und Forward-Fehler melden</label><label>Öffentlicher HTTPS-Webhook<input id="notification-webhook" type="url"></label><label>E-Mail-Adresse<input id="notification-email" type="email"></label><label>SMTP-Host<input id="notification-smtp-host"></label><label>SMTP-Port<input id="notification-smtp-port" type="number" min="1" max="65535" value="465"></label><label>SMTP-Benutzer<input id="notification-smtp-user"></label><label>Neues SMTP-Passwort<input id="notification-smtp-password" type="password" autocomplete="new-password"></label><button class="secondary">Benachrichtigungen speichern</button></form></section>
