<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{viewer ~ ' · Live' if viewer else 'Vorschau'}}</title>
    <link rel="stylesheet" href="/static/player.css?v={{app_version}}&amp;b={{asset_build}}">
    <script src="hls.min.js" defer></script>
    <script src="/static/player.js?v={{app_version}}&amp;b={{asset_build}}" defer></script>
</head>

<body data-switch-text="{{switch_text|default('Synchronisation')}}"><video controls autoplay muted playsinline></video>
    <div id="player-audio" class="player-audio" aria-label="Vorschauton"><button id="player-audio-toggle" type="button" aria-pressed="false">Ton einschalten</button><label>Lautstärke <input id="player-volume" type="range" min="0" max="100" value="70"></label><span id="player-audio-status" role="status">Vorschau ist stumm.</span></div>
    <p id="message">{{switch_text|default('Synchronisation')}}</p>
</body>

</html>
