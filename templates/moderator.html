<!doctype html>
<html lang="{{language}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{csrf}}"><title>Chat · MediaMTX - StreamDesk</title>
<link rel="stylesheet" href="/static/style.css?v={{app_version}}&amp;b={{asset_build}}"><link rel="stylesheet" href="/static/features.css?v={{app_version}}&amp;b={{asset_build}}">
<script src="/static/chat.js?v={{app_version}}&amp;b={{asset_build}}" defer></script><script src="/static/moderator.js?v={{app_version}}&amp;b={{asset_build}}" defer></script></head>
<body class="login-page"><main class="login-card moderator-card">
<div class="brand"><span class="brand-mark">◧</span> MediaMTX - StreamDesk</div>
<h1>Moderation · Live-Chat</h1><p class="muted">Dieses Konto kann ausschließlich den zugewiesenen Chat lesen und Nachrichten senden.</p>
<div class="chat-connections" id="moderator-status">Verbinde …</div>
<div class="chat-messages" role="log" aria-live="polite"></div>
<form class="chat-compose"><label>Ziel<select class="chat-target"><option value="both">Twitch + YouTube</option><option value="twitch">Twitch</option><option value="youtube">YouTube</option><option value="discord">Discord</option></select></label>
<textarea class="chat-message" maxlength="200" required></textarea><button class="primary" type="submit">Senden</button></form>
<details><summary>Mein Konto · Passwort ändern</summary><form id="moderator-password"><label>Bisheriges Passwort<input name="current" type="password" autocomplete="current-password" required></label><label>Neues Passwort<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><button class="secondary">Passwort ändern</button></form></details>
<button id="logout" class="ghost" type="button">Abmelden</button><p id="feedback" role="status"></p>
</main></body></html>
